name: ci

# Tanpa paddle: test memakai FakeEngine. Image GPU dibangun oleh deploy-dev / build-push setelah ini hijau.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (tanpa paddle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: contract/ tidak basi
        run: python -m ocr_service.export_contract --check
      - run: pytest -q
